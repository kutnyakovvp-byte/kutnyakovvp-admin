<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель Штурмана</title><meta name="description" content="Панель команды"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;600;700&display=swap"><style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}:root{color-scheme:light}body{font:14px system-ui}</style><style>
:root {
  --ground: #EDF0F2; --card: #F8FAFB; --line: #CBD3D9;
  --ink: #141A1F; --ink-2: #46525C;
  --blue: #0B5AA6; --on-blue: #F8FAFB; --blue-tint: #DCE9F5;
  --green: #0F6B3B; --green-tint: #DDEEE3;
  --orange: #B9490A; --orange-text: #9E3A0A; --orange-tint: #F8E4D6;
  --red: #B3262B; --red-tint: #F6DFE0;
  --slate: #55626D; --slate-tint: #E2E7EA;
  --yellow: #F2C200; --yellow-text: #5A4500; --yellow-tint: #FBEFB8;
  --focus: #0B5AA6;
  --head: 'Fira Sans Condensed', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif;
  --body: 'Fira Sans', 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1418; --card: #182027; --line: #2B353D;
    --ink: #EDF0F2; --ink-2: #A8B4BD;
    --blue: #6CB0F0; --on-blue: #0F1418; --blue-tint: #14283A;
    --green: #5FC58A; --green-tint: #173325;
    --orange: #F29A5C; --orange-text: #F29A5C; --orange-tint: #3A2415;
    --red: #F28B8E; --red-tint: #3A1C1E;
    --slate: #9AA7B1; --slate-tint: #252E36;
    --yellow: #F2C200; --yellow-text: #F2C200; --yellow-tint: #3A3210;
    --focus: #6CB0F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1418; --card: #182027; --line: #2B353D;
  --ink: #EDF0F2; --ink-2: #A8B4BD;
  --blue: #6CB0F0; --on-blue: #0F1418; --blue-tint: #14283A;
  --green: #5FC58A; --green-tint: #173325;
  --orange: #F29A5C; --orange-text: #F29A5C; --orange-tint: #3A2415;
  --red: #F28B8E; --red-tint: #3A1C1E;
  --slate: #9AA7B1; --slate-tint: #252E36;
  --yellow: #F2C200; --yellow-text: #F2C200; --yellow-tint: #3A3210;
  --focus: #6CB0F0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--ground);
}
.app { max-width: 480px; margin: 0 auto; padding-block: 0 48px; min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--head); margin: 0; line-height: 1.12; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 20px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 16px; line-height: 1.4; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.num { font-family: var(--head); font-weight: 700; font-variant-numeric: tabular-nums; }

/* шапка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ground); padding-block: 12px 12px; display: flex; flex-direction: column; gap: 8px;
}
.top-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.top-row .label { flex: 1; font-size: 16px; color: var(--ink-2); }
.prog { display: flex; gap: 4px; }
.prog span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.prog span.on { background: var(--blue); }
.back {
  min-width: 48px; min-height: 44px; border: 0; background: transparent; color: var(--blue);
  font: 600 16px/1 var(--body); padding: 0 8px 0 0; cursor: pointer; text-align: left;
}
.screen { display: flex; flex-direction: column; gap: 20px; padding-top: 8px; }

/* кнопки */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 52px; padding: 12px 18px; border-radius: 12px; border: 2px solid var(--blue);
  background: var(--blue); color: var(--on-blue); font: 600 18px/1.2 var(--body);
  cursor: pointer; text-align: center; text-decoration: none;
}
.btn.sec { background: transparent; color: var(--blue); }
.btn.link { border-color: transparent; background: transparent; color: var(--blue); min-height: 44px; }
.btn[disabled] { background: var(--slate-tint); border-color: var(--slate-tint); color: var(--slate); cursor: not-allowed; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btns { display: flex; flex-direction: column; gap: 10px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* варианты выбора */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 14px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
  font: 400 18px/1.3 var(--body); text-align: left; cursor: pointer;
}
.opt .mark { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.opt.check .mark { border-radius: 6px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--blue); background: var(--blue-tint); font-weight: 600; }
.opt[aria-pressed="true"] .mark, .opt[aria-checked="true"] .mark { border-color: var(--blue); background: var(--blue); color: var(--on-blue); }
.opt .sub { display: block; font-weight: 400; font-size: 16px; color: var(--ink-2); margin-top: 2px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale .opt { justify-content: center; padding: 10px 0; font-family: var(--head); font-weight: 700; font-size: 20px; }
.scale-legend { display: flex; justify-content: space-between; font-size: 16px; color: var(--ink-2); }

/* карточки */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.flat { background: transparent; }
.signal { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.signal .stripe { width: 8px; flex: none; background: var(--yellow); }
.signal .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.note { background: var(--yellow-tint); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 16px; }

/* табличка города */
.plate {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 52px; height: 38px; padding: 0 8px; border-radius: 8px;
  background: var(--blue); color: var(--on-blue); box-shadow: inset 0 0 0 2px var(--card);
  font: 700 20px/1 var(--head); letter-spacing: 1px;
}
.plate.lg { min-width: 64px; height: 46px; font-size: 24px; }
.city { display: flex; align-items: center; gap: 12px; }
.city .nm { font-family: var(--head); font-weight: 700; font-size: 22px; line-height: 1.1; }
.city .rg { font-size: 16px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; min-height: 48px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  font: 400 16px/1.2 var(--body); cursor: pointer; text-align: left;
}
.tile[disabled] { opacity: .45; cursor: not-allowed; }

/* статусы */
.badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; border-radius: 8px; padding: 4px 10px; font: 600 16px/1.3 var(--body); }
.badge.green { background: var(--green-tint); color: var(--green); }
.badge.orange { background: var(--orange-tint); color: var(--orange-text); }
.badge.red { background: var(--red-tint); color: var(--red); }
.badge.slate { background: var(--slate-tint); color: var(--slate); }
.badge.yellow { background: var(--yellow-tint); color: var(--yellow-text); }
.badge.blue { background: var(--blue-tint); color: var(--blue); }
.src { font-size: 16px; color: var(--ink-2); }
.src a { color: var(--blue); }

/* число-итог */
.big { font: 700 44px/1 var(--head); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font: 700 32px/1 var(--head); }
.kpi .l { font-size: 16px; line-height: 1.25; color: var(--ink-2); }

/* слайдер */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider-val { font: 700 32px/1 var(--head); color: var(--blue); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; height: 44px; accent-color: var(--blue); background: transparent; margin: 0; }
.ends { display: flex; justify-content: space-between; font-size: 16px; color: var(--ink-2); }
.track { position: relative; height: 54px; margin-top: 4px; }
.track .bar { position: absolute; left: 0; right: 0; top: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.track .zero { position: absolute; top: 14px; width: 2px; height: 24px; background: var(--ink-2); }
.track .mk { position: absolute; top: 10px; width: 6px; height: 32px; border-radius: 3px; margin-left: -3px; transition: left .18s ease-out; }
.track .mk.you { background: var(--blue); }
.track .mk.fact { background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 16px; }
.legend i { display: inline-block; width: 6px; height: 16px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }

/* списки */
.list { display: flex; flex-direction: column; }
.list .li { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .li:last-child { border-bottom: 0; }
.list .li .k { flex: 1; min-width: 0; }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; color: var(--blue); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
textarea { width: 100%; min-height: 96px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: 400 18px/1.4 var(--body); resize: vertical; }
textarea:focus { border-color: var(--blue); }
.passport { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.passport .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.passport .sec h3 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-2); margin-bottom: 6px; }
.code { font: 700 18px/1.4 'Fira Sans Condensed', monospace; letter-spacing: 1px; word-break: break-all; background: var(--slate-tint); border-radius: 8px; padding: 8px 10px; }
.copybox { width: 100%; min-height: 160px; font-size: 16px; }
.toast { min-height: 24px; font-size: 16px; color: var(--green); font-weight: 600; }


.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero-signs { display: flex; gap: 8px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .btn:active:not([disabled]) { transform: none; }
}
@media (min-width: 720px) {
  body { font-size: 18px; }
  .app { padding-top: 24px; }
}

/* ===== v1.0: игровой слой ===== */
.title { font-size: 44px; letter-spacing: .5px; }
.lead { font-size: 18px; line-height: 1.5; color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 600 18px/1.3 var(--body); }
.field input {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--card); color: var(--ink); font: 400 18px/1.3 var(--body);
}
.field input:focus { border-color: var(--blue); outline: none; }
.ib {
  display: inline-grid; place-items: center; width: 18px; height: 18px; margin: 0 1px 0 2px; padding: 0;
  border-radius: 50%; border: 1.5px solid var(--blue); background: var(--card); color: var(--blue);
  font: 700 12px/1 var(--head); font-style: italic; vertical-align: super; cursor: pointer; position: relative;
}
.ib::after { content: ""; position: absolute; inset: -10px; }
.top-row .score {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px;
  background: var(--yellow); color: #141A1F; font: 700 16px/1.2 var(--head); white-space: nowrap;
}
.roadbar { position: relative; height: 22px; display: flex; justify-content: space-between; align-items: center; margin: 2px 10px 0; }
.roadbar .lane { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 16px); }
.roadbar .ms { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--ground); border: 2px solid var(--line); }
.roadbar .ms.done { background: var(--blue); border-color: var(--blue); }
.roadbar .ms.cur { border-color: var(--blue); }
.roadbar .car { position: absolute; top: -6px; color: var(--blue); transition: left .35s ease-out; }
.chip {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--ground); font: 700 16px/1.2 var(--head); padding: 10px 16px; border-radius: 999px;
}
.map { width: 100%; height: auto; display: block; }
.map .sea { fill: var(--blue-tint); }
.map .land { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.map .road { fill: none; stroke: var(--blue); stroke-width: 3; stroke-dasharray: 6 5; stroke-linecap: round; }
.map .dot { fill: var(--slate); }
.map .pl rect { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.map .pl text { fill: var(--ink-2); font: 700 13px var(--head); }
.map .pl.on .dot { fill: var(--ink); }
.map .pl.on rect { fill: var(--blue); stroke: var(--card); stroke-width: 1.5; }
.map .pl.on text { fill: var(--on-blue); }
.map .pl.main rect { stroke: var(--yellow); stroke-width: 3; }
.map .pl text.bal { fill: var(--ink); font: 700 12px var(--head); }
.map [role="button"] { cursor: pointer; }
.map [role="button"]:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.legs { display: flex; flex-direction: column; gap: 10px; position: relative; padding-left: 4px; }
.leg { display: flex; gap: 12px; align-items: flex-start; }
.legn { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--blue); color: var(--on-blue); font: 700 16px/1 var(--head); }
.tank { position: relative; height: 18px; border-radius: 9px; background: var(--blue); overflow: hidden; }
.tank .rent { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--orange) 0 6px, var(--orange-tint) 6px 10px); }
.tank-leg { display: flex; justify-content: space-between; color: var(--ink-2); }
.plate.sm { min-width: 40px; height: 28px; font-size: 16px; }
.btn.mini { width: auto; min-height: 44px; padding: 8px 10px; }
.card.sch.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.signal .stripe { width: 30px; display: flex; justify-content: center; padding-top: 16px; font: 700 18px/1 var(--head); color: #141A1F; }
.row > .btn { flex: 1; }
.list .li .r { text-align: right; max-width: 60%; }
.finish { display: flex; flex-direction: column; gap: 14px; padding: 20px 16px; border-radius: 16px; background: var(--card); border: 2px solid var(--blue); }
.eyebrow { font: 700 14px/1 var(--head); letter-spacing: 2px; text-transform: uppercase; color: var(--blue); }
.rankrow { display: flex; align-items: center; gap: 14px; }
.bignum { font: 700 72px/0.9 var(--head); font-variant-numeric: tabular-nums; color: var(--blue); }
.rank { font: 700 22px/1.2 var(--head); }
.parts { display: flex; flex-direction: column; gap: 8px; }
.part { display: grid; grid-template-columns: 1fr 90px 48px; gap: 8px; align-items: center; font-size: 16px; }
.pbar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
.pv { text-align: right; font: 700 16px/1 var(--head); font-variant-numeric: tabular-nums; }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bdg { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 12px; border: 1px dashed var(--line); color: var(--ink-2); font-size: 15px; line-height: 1.3; }
.bdg .bi { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--slate-tint); color: var(--slate); font: 700 16px/1 var(--head); }
.bdg .sub { display: block; font-size: 14px; }
.bdg.got { border: 1px solid var(--green); color: var(--ink); background: var(--green-tint); }
.bdg.got .bi { background: var(--green); color: var(--card); }
#sheet-root { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(15, 20, 24, .5); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 85vh; overflow: auto; margin: 0 auto; max-width: 520px;
  background: var(--ground); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.sheet-hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-bd { display: flex; flex-direction: column; gap: 12px; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--slate-tint); color: var(--ink); font-size: 18px; cursor: pointer; flex: none; }
.pimg { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .roadbar .car { transition: none; } }

.nw { white-space: nowrap; }
.city .grow { flex: 1; min-width: 0; }
.big { white-space: nowrap; }

.docrow { display: flex; flex-direction: column; gap: 4px; }
.terms { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-left: 14px; font-size: 15px; color: var(--ink-2); }
.tl { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 2px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--blue); font: 600 15px/1.2 var(--body); cursor: pointer; }
.tl:hover { background: var(--blue-tint); }
.tli { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--blue); font: 700 11px/1 var(--head); font-style: italic; }
.admin { max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.admin h1 { font-size: 36px; }
.admin h2 { font-size: 24px; }
.admin h3 { font-size: 18px; }
.ahead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--blue); padding-bottom: 14px; }
.ahead .stat { display: flex; flex-direction: column; align-items: flex-end; }
.ahead .stat .num { font: 700 48px/1 var(--head); color: var(--blue); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lvl { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.kpis4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpis4 .kpi .v { font-size: 30px; }
.kpis4 .kpi .n { font-size: 14px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hb { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 15px; }
.hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

const CODEC = (function () {
  "use strict";
  const B = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const PREFIX = "SH2";
  const CHANNELS = ["direct", "tg", "ig", "vk", "rutoitaly", "andrey", "viktor", "test", "friends", "post", "story", "chat", "wa", "site"];

  const SCHEMA = [["ch", 1], ["lv", 1], ["cit", 1], ["age", 1], ["fld", 1], ["pri", 1], ["c0", 1], ["c1", 1], ["c2", 1], ["p0", 2], ["p1", 2], ["p2", 2],
    ["f0", 1], ["f1", 1], ["f2", 1], ["main", 1], ["picks", 4], ["closed", 1], ["docs", 2], ["k0", 1], ["k0c", 1], ["k1", 1], ["k1c", 1],
    ["conf0", 1], ["conf1", 1], ["useful", 1], ["score", 2], ["info", 1], ["min", 2]];
  const LEN = SCHEMA.reduce((a, f) => a + f[1], 0) + 1;
  const enc = (n, w) => { const max = Math.pow(36, w) - 1; n = Math.max(0, Math.min(max, Math.round(Number(n) || 0))); let s = ""; for (let i = 0; i < w; i++) { s = B[n % 36] + s; n = Math.floor(n / 36); } return s; };
  const dec = (s) => s.split("").reduce((a, ch) => a * 36 + B.indexOf(ch), 0);
  function encode(o) {
    const body = SCHEMA.map(([k, w]) => enc(o[k], w)).join("");
    const sum = body.split("").reduce((a, ch) => a + B.indexOf(ch), 0) % 36;
    return PREFIX + "-" + (body + B[sum]).match(/.{1,4}/g).join("-");
  }
  function decode(code) {
    const s = String(code || "").toUpperCase().replace(new RegExp("^\\s*" + PREFIX + "-?"), "").replace(/[^0-9A-Z]/g, "");
    if (s.length !== LEN) return { error: "В коде должно быть " + LEN + " знаков после " + PREFIX + ", а здесь " + s.length + "." };
    const body = s.slice(0, LEN - 1), sum = body.split("").reduce((a, ch) => a + B.indexOf(ch), 0) % 36;
    if (B[sum] !== s[LEN - 1]) return { error: "Контрольный знак не сходится: код скопирован с ошибкой." };
    let p = 0; const o = {};
    SCHEMA.forEach(([k, w]) => { o[k] = dec(body.slice(p, p + w)); p += w; });
    o.code = PREFIX + "-" + s.match(/.{1,4}/g).join("-");
    return o;
  }
  const RE = new RegExp(PREFIX + "-[0-9A-Z]{4}(?:-[0-9A-Z]{1,4}){" + Math.ceil(LEN / 4 - 1) + "}", "g");
  return { encode, decode, RE, LEN, CHANNELS, LEVELS, CITS, AGES, PRIOS, COMP_NAMES };
})();

      ["Пояснений открыто", d.info], ["Минут в игре", d.min], ["Комментарий", r.comment || "—"]
    ];
    return `<section class="panel" id="dt"><div class="row between"><h2>${esc(r.name || "Прохождение")}</h2><button class="btn link mini" data-a="closedetail">Закрыть</button></div><div class="list">${lines.map(([k, v]) => `<div class="li small"><b class="dk">${esc(k)}</b><span class="k">${esc(v)}</span></div>`).join("")}</div></section>`;
  }

  /* ---------- разбор сообщений Telegram ---------- */
  function parse(text) {
    const out = [], re = new RegExp(CODEC.RE.source, "g");
    let m, prevEnd = 0;
    while ((m = re.exec(text))) {
      const seg = text.slice(prevEnd, m.index); prevEnd = m.index + m[0].length;
      const grab = (label) => { const r = seg.match(new RegExp("^\\s*" + label + ":\\s*(.+)$", "mi")); return r ? r[1].trim().replace(/^—$/, "") : ""; };
      const d = CODEC.decode(m[0]);
      if (d.error) { out.push({ code: m[0], error: d.error }); continue; }
      out.push({ code: d.code, id: idOf(d.code), name: grab("Имя").slice(0, 60), nick: grab("Ник").slice(0, 60), comment: grab("Комментарий").slice(0, 400), channelRaw: grab("Канал").slice(0, 40), d });
    }
    return out;
  }

  /* ---------- CSV ---------- */
  function csv() {
    const R = window.__rows || [];
    const head = ["дата", "имя", "ник", "канал", "уровень", "гражданство", "возраст", "направление", "приоритет", "город1", "прогноз1", "город2", "прогноз2", "город3", "прогноз3", "итоговые города", "основной город", "закрытых в плане", "документов", "объезд1", "объезд2", "очки", "звание", "уверенность до", "уверенность после", "польза", "пояснений", "минут", "написал Андрею", "консультация", "комментарий", "код"];
    const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const nm = (a, i) => (a[i] ? a[i].name || a[i].label : "");
    const lines = R.map((r) => { const d = r.d; return [r.first ? new Date(r.first).toISOString().slice(0, 10) : "", r.name, r.nick, r.ch, LEVELS[d.lv] && LEVELS[d.lv].label, CITS[d.cit] && CITS[d.cit].label, AGES[d.age] && AGES[d.age].label, D.fields[d.fld] && D.fields[d.fld].label, PRIOS[d.pri] && PRIOS[d.pri].label,
      nm(C, d.c0), d.p0 === 99 ? "" : d.p0 * 10 - 300, nm(C, d.c1), d.p1 === 99 ? "" : d.p1 * 10 - 300, nm(C, d.c2), d.p2 === 99 ? "" : d.p2 * 10 - 300,
      ["f0", "f1", "f2"].map((k) => nm(C, d[k])).join(", "), nm(C, d.main), d.closed, D.docs.filter((_, i) => Math.floor(d.docs / Math.pow(2, i)) % 2 === 1).length,
      d.k0 === 35 ? "" : COMP_NAMES[d.k0], d.k1 === 35 ? "" : COMP_NAMES[d.k1], d.score, rankOf(d.score), d.conf0 || "", d.conf1 || "", d.useful || "", d.info, d.min, r.wrote ? "да" : "нет", r.consult ? "да" : "нет", r.comment, d.code].map(q).join(","); });
    return "﻿" + [head.map(q).join(",")].concat(lines).join("\r\n");
  }

  /* ---------- действия ---------- */
  function note(t) { const n = document.createElement("p"); n.className = "note"; n.textContent = t; root.prepend(n); setTimeout(() => n.remove(), 7000); }
  root.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-a]"); if (!el) return;
    const a = el.dataset.a, v = el.dataset.v;
    if (a === "connect") {
      url = document.getElementById("cu").value.trim(); key = document.getElementById("ck").value; remember = document.getElementById("cr").checked;
      if (!/^(https:\/\/script\.google(usercontent)?\.com\/|http:\/\/(127\.0\.0\.1|localhost)[:\/])/.test(url)) { status = { st: "error", msg: "Ссылка должна начинаться с https://script.google.com/…", at: 0 }; editConn = true; return render(); }
      lsSet("shturman.admin.url", url); if (remember) { lsSet("shturman.admin.key", key); ssDel("shturman.admin.key"); } else { ssSet("shturman.admin.key", key); lsDel("shturman.admin.key"); }
      editConn = false; await load(true); startPoll(); return;
    }
    if (a === "editconn") { editConn = true; return render(); }
    if (a === "cancelconn") { editConn = false; return render(); }
    if (a === "refresh") { await load(true); return; }
    if (a === "parse") { const t = document.getElementById("paste").value; const known = new Set((window.__rows || []).filter((r) => r.auto).map((r) => r.id)); pending = parse(t).map((p) => (p.error ? p : Object.assign(p, { known: known.has(p.id) }))); if (!pending.length) pending = [{ code: "—", error: "В тексте не нашлось кодов SH2." }]; return render(); }
    if (a === "clearpending") { pending = []; return render(); }
    if (a === "savepending") {
      const todo = pending.filter((p) => !p.error);
      todo.forEach((p) => { local[p.id] = { code: p.code, name: p.name, nick: p.nick, comment: p.comment, channelRaw: p.channelRaw, addedAt: new Date().toISOString() }; });
      saveLocal(); pending = []; pasteVal = ""; render();
      for (const p of todo) await mark(p.code, { wrote: true });
      await load(true); return;
    }
    if (a === "consult") {
      const r = (window.__rows || []).find((x) => x.id === v); if (!r) return;
      const on = !r.consult; leads.set(v, Object.assign({}, leads.get(v), { consult: on })); render();
      await mark(r.d.code, { consult: on, wrote: r.wrote || on }); return;
    }
    if (a === "detail") { const r = (window.__rows || []).find((x) => x.id === v); if (r) { document.getElementById("detail").innerHTML = detailHtml(r); document.getElementById("dt").scrollIntoView({ behavior: "smooth" }); } return; }
    if (a === "closedetail") { document.getElementById("detail").innerHTML = ""; return; }
    if (a === "decode") { const d = CODEC.decode(document.getElementById("one").value); const out = document.getElementById("oneout"); out.innerHTML = d.error ? `<p class="note">${esc(d.error)}</p>` : detailHtml({ name: "", nick: "", comment: "", ch: d.ch === 35 ? "другой" : CHANNELS[d.ch] || "?", d }).replace(/<button class="btn link mini" data-a="closedetail">Закрыть<\/button>/, ""); return; }
    if (a === "csv") {
      const data = csv();
      try { const u = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" })), l = document.createElement("a"); l.href = u; l.download = "shturman-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 8000); return; } catch (err) { /* ниже запасной вариант */ }
      document.getElementById("detail").innerHTML = `<section class="panel" id="dt"><div class="row between"><h2>CSV</h2><button class="btn link mini" data-a="closedetail">Закрыть</button></div><p class="small muted">Скачивание здесь недоступно — скопируйте текст и сохраните как .csv.</p><textarea class="copybox" readonly>${esc(data)}</textarea></section>`;
    }
  });

  /* ---------- запуск ---------- */
  render();
  if (url && key) { load(true).then(startPoll); }
  window.__admin = { parse, sessions, rowsFrom, csv, get events() { return events; }, SCREENS };
})();

</script>
